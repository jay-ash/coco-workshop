name: SV_AP_ANALYTICS
description: >-
  This semantic view supports accounts payable (AP) invoice analytics across four source ERP systems:
  SAP, Oracle, Baan and Workday. It represents data at one row per supplier invoice per source system.
  It enables analysis of AP spend, invoice volume, approval status and upcoming due dates by vendor,
  cost center, GL account, source system and time. Amounts are in the original transaction currency
  (USD, GBP, EUR) with no FX conversion. Payment (paid/unpaid) status is not available.
tables:
  - name: AP_INVOICES
    description: >-
      Supplier invoices from SAP, Oracle, Baan and Workday standardized to a common schema, one row per
      invoice per source system. Current state only (no history of changes). Amounts are in the invoice's
      own currency. Contains no payment or remittance information.
    base_table:
      database: COCO_WORKSHOP
      schema: PIPELINE_LAB
      table: SILVER_AP_INVOICES
    primary_key:
      columns:
        - SOURCE_SYSTEM
        - INVOICE_ID
    dimensions:
      - name: SOURCE_SYSTEM
        synonyms: [ERP, source, system, source ERP]
        description: ERP system the invoice came from. One of SAP, ORACLE, BAAN or WORKDAY.
        expr: SOURCE_SYSTEM
        data_type: VARCHAR
        is_enum: true
        sample_values: [SAP, ORACLE, BAAN, WORKDAY]
      - name: INVOICE_ID
        synonyms: [invoice key, document id]
        description: Source-system technical identifier of the invoice. Unique only together with source system.
        expr: INVOICE_ID
        data_type: VARCHAR
      - name: INVOICE_NUMBER
        synonyms: [invoice no, invoice reference, business invoice number]
        description: Business-facing invoice number as printed on the supplier invoice.
        expr: INVOICE_NUMBER
        data_type: VARCHAR
      - name: VENDOR_KEY
        synonyms: [vendor, supplier, payee, vendor identifier]
        description: >-
          Unique vendor identifier across all systems, formed from source system and vendor ID. Use this
          to count or rank distinct vendors. The same real-world supplier in two systems appears as two keys.
        expr: SOURCE_SYSTEM || ':' || VENDOR_ID
        data_type: VARCHAR
      - name: VENDOR_ID
        synonyms: [supplier id, vendor code, supplier code]
        description: Vendor (supplier) code in the source system. Not unique across source systems.
        expr: VENDOR_ID
        data_type: VARCHAR
      - name: VENDOR_NAME
        synonyms: [vendor, supplier, supplier name, payee]
        description: Vendor (supplier) name as recorded in the source system.
        expr: VENDOR_NAME
        data_type: VARCHAR
      - name: CURRENCY_CODE
        synonyms: [currency, invoice currency]
        description: ISO currency of the invoice amount. Amounts in different currencies must not be added together.
        expr: CURRENCY_CODE
        data_type: VARCHAR
        is_enum: true
        sample_values: [USD, GBP, EUR]
      - name: PAYMENT_TERMS
        synonyms: [terms, payment terms]
        description: Standardized payment terms, NET30 or NET60.
        expr: PAYMENT_TERMS
        data_type: VARCHAR
        is_enum: true
        sample_values: [NET30, NET60]
      - name: APPROVAL_STATUS
        synonyms: [status, invoice status, approval]
        description: >-
          Standardized approval status, APPROVED or PENDING. Oracle VALIDATED and Baan POSTED count as APPROVED;
          Workday In Review counts as PENDING. Approved does not mean paid.
        expr: APPROVAL_STATUS
        data_type: VARCHAR
        is_enum: true
        sample_values: [APPROVED, PENDING]
      - name: COST_CENTER
        synonyms: [business unit, BU, department, cost centre]
        description: >-
          Cost center charged by the invoice, in the source system's own coding (e.g. BC-ENG for Baan,
          WCC-XXXX for Workday). Used as the business unit. Codes are not harmonized across systems.
        expr: COST_CENTER
        data_type: VARCHAR
      - name: GL_ACCOUNT
        synonyms: [GL code, general ledger account, ledger account, account code]
        description: General ledger account in the source system's own numbering. Not comparable across source systems.
        expr: GL_ACCOUNT
        data_type: VARCHAR
      - name: PO_NUMBER
        synonyms: [purchase order, PO]
        description: Purchase order referenced by the invoice, if any.
        expr: PO_NUMBER
        data_type: VARCHAR
      - name: LINE_DESCRIPTION
        synonyms: [memo, description, invoice description]
        description: Free-text description of the invoice; may be in Dutch for Baan invoices.
        expr: LINE_DESCRIPTION
        data_type: VARCHAR
      - name: PAYMENT_TERMS_RAW
        description: Payment terms exactly as received from the source system (e.g. N30, Net 30). Prefer PAYMENT_TERMS.
        expr: PAYMENT_TERMS_RAW
        data_type: VARCHAR
      - name: APPROVAL_STATUS_RAW
        description: Approval status exactly as received from the source system (e.g. VALIDATED, POSTED, In Review). Prefer APPROVAL_STATUS.
        expr: APPROVAL_STATUS_RAW
        data_type: VARCHAR
      - name: COMPANY_CODE
        description: Company or organization code; populated for SAP and Oracle invoices only.
        expr: COMPANY_CODE
        data_type: VARCHAR
    time_dimensions:
      - name: INVOICE_DATE
        synonyms: [invoice date, date, billing date, month]
        description: >-
          Date on the invoice. The default date for spend, volume and trend questions such as
          "last 12 months" or "by month".
        expr: INVOICE_DATE
        data_type: DATE
      - name: DUE_DATE
        synonyms: [payment due date, due]
        description: Date payment of the invoice is due under its payment terms.
        expr: DUE_DATE
        data_type: DATE
      - name: CREATED_AT
        synonyms: [entry date, created date]
        description: Timestamp (UTC) when the invoice was recorded in the source system.
        expr: CREATED_AT
        data_type: TIMESTAMP_NTZ
    facts:
      - name: INVOICE_AMOUNT
        synonyms: [amount, invoice value, invoice total]
        description: Invoice amount in the invoice's own currency (see currency code). No FX conversion is applied.
        expr: INVOICE_AMOUNT
        data_type: NUMBER
    metrics:
      - name: TOTAL_INVOICE_AMOUNT
        synonyms: [AP spend, total spend, spend, total invoiced, invoice amount]
        description: >-
          Total invoiced amount in original currency. Always break down by currency code; never present one
          total across currencies.
        expr: SUM(INVOICE_AMOUNT)
      - name: OUTSTANDING_INVOICE_AMOUNT
        synonyms: [unpaid amount, unpaid invoice amount, open amount, open AP, outstanding balance]
        description: >-
          Amount of invoices treated as unpaid. Payment data is not available, so every invoice is treated as
          unpaid and this equals the total invoiced amount. Break down by currency code.
        expr: SUM(INVOICE_AMOUNT)
      - name: PENDING_APPROVAL_AMOUNT
        synonyms: [amount awaiting approval, pending amount]
        description: Invoiced amount still pending approval, in original currency.
        expr: SUM(CASE WHEN APPROVAL_STATUS = 'PENDING' THEN INVOICE_AMOUNT END)
      - name: INVOICE_COUNT
        synonyms: [number of invoices, invoice volume, count of invoices]
        description: Number of invoices. Safe to total across currencies and source systems.
        expr: COUNT(*)
      - name: VENDOR_COUNT
        synonyms: [number of vendors, supplier count]
        description: Number of distinct vendors, counting a supplier separately in each source system.
        expr: COUNT(DISTINCT SOURCE_SYSTEM || ':' || VENDOR_ID)
      - name: AVERAGE_INVOICE_AMOUNT
        synonyms: [average invoice value, mean invoice amount]
        description: Average invoice amount in original currency. Break down by currency code.
        expr: AVG(INVOICE_AMOUNT)
    filters:
      - name: PENDING_APPROVAL
        synonyms: [pending, awaiting approval, not approved]
        description: Invoices still pending approval.
        expr: APPROVAL_STATUS = 'PENDING'
      - name: APPROVED
        synonyms: [approved invoices]
        description: Invoices that have been approved (not necessarily paid).
        expr: APPROVAL_STATUS = 'APPROVED'
verified_queries:
  - name: How much is pending approval by source system and currency?
    question: How much is pending approval by source system and currency?
    sql: SELECT source_system, currency_code, SUM(CASE WHEN approval_status = 'PENDING' THEN invoice_amount END) AS pending_approval_amount FROM ap_invoices GROUP BY source_system, currency_code
    verified_at: 1795087787
  - name: Total AP spend by vendor over the last 12 months
    question: Total AP spend by vendor over the last 12 months
    sql: WITH bounds AS (SELECT MAX(invoice_date) AS max_date FROM ap_invoices) SELECT vendor_key, vendor_name, currency_code, SUM(invoice_amount) AS total_invoice_amount, MIN(invoice_date) AS period_start, MAX(invoice_date) AS period_end FROM ap_invoices CROSS JOIN bounds WHERE invoice_date > DATEADD(MONTH, -12, bounds.max_date) GROUP BY vendor_key, vendor_name, currency_code ORDER BY currency_code, total_invoice_amount DESC NULLS LAST
    verified_at: 1795087804
  - name: Invoice count by month and business unit
    question: Invoice count by month and business unit
    sql: SELECT DATE_TRUNC('MONTH', invoice_date) AS invoice_month, source_system, cost_center, COUNT(*) AS invoice_count FROM ap_invoices GROUP BY DATE_TRUNC('MONTH', invoice_date), source_system, cost_center ORDER BY invoice_month, source_system, cost_center
    verified_at: 1795087810
  - name: Top 10 vendors by unpaid invoice amount
    question: Top 10 vendors by unpaid invoice amount
    sql: SELECT currency_code, vendor_key, vendor_name, SUM(invoice_amount) AS outstanding_invoice_amount FROM ap_invoices GROUP BY currency_code, vendor_key, vendor_name QUALIFY ROW_NUMBER() OVER (PARTITION BY currency_code ORDER BY SUM(invoice_amount) DESC NULLS LAST) <= 10 ORDER BY currency_code, outstanding_invoice_amount DESC NULLS LAST
    verified_at: 1795087816
  - name: Which invoices are due in the 30 days after the latest invoice date?
    question: Which invoices are due in the 30 days after the latest invoice date?
    sql: WITH bounds AS (SELECT MAX(invoice_date) AS max_date FROM ap_invoices) SELECT source_system, invoice_number, vendor_name, due_date, invoice_amount, currency_code, approval_status FROM ap_invoices CROSS JOIN bounds WHERE due_date >= bounds.max_date AND due_date < DATEADD(DAY, 30, bounds.max_date) ORDER BY due_date, currency_code
    verified_at: 1795087821
custom_instructions: >-
  Amounts are in the invoice's original currency and must never be summed across currencies: always include
  CURRENCY_CODE in the grouping of any amount metric and tell the user amounts are not FX-converted.
  There is no payment status; if asked about unpaid or outstanding invoices, use OUTSTANDING_INVOICE_AMOUNT and
  state that all invoices are treated as unpaid because payment data is unavailable. Treat "business unit" as
  COST_CENTER. For relative periods such as "last 12 months", anchor on the latest INVOICE_DATE in the data
  rather than today's date, and state the date range used. Use VENDOR_KEY to rank or count distinct vendors and
  show VENDOR_NAME alongside it. Compare GL_ACCOUNT and COST_CENTER only within a single SOURCE_SYSTEM.